  <pattern id="grid" width="31" height="31" patternUnits="userSpaceOnUse"><path d="M31 0H0V31" fill="none" stroke="#7492B9" stroke-opacity=".085" stroke-width="1"/></pattern>
  <filter id="shadow" x="-30%" y="-40%" width="170%" height="180%"><feDropShadow dx="0" dy="18" stdDeviation="23" flood-color="#000817" flood-opacity=".35"/></filter>
</defs>
