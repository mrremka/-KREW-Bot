<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">KREW — Telegram community management</title>
<desc id="desc">Dark indigo product banner featuring KREW, chat protection, reports and Mini App interface.</desc>
<defs>
